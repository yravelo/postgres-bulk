name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Baseline — Java 17 / Boot 3.5.16 / PostgreSQL 15.18
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: code/postgres-bulk-parent

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: |
            code/postgres-bulk-parent/pom.xml
            code/postgres-bulk-parent/*/pom.xml

      - name: Verify reactor
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
