name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]

    defaults:
      run:
        working-directory: code/postgres-bulk-parent

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: |
            code/postgres-bulk-parent/pom.xml
            code/postgres-bulk-parent/*/pom.xml

      - name: Verify reactor
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
