name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable SemVer release version (for example 0.1.0)
        required: true
        type: string
      commit_sha:
        description: Full 40-character commit SHA from main to inspect
        required: true
        type: string
      confirmation:
        description: Type "candidate <version>"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate
  cancel-in-progress: false

jobs:
  candidate:
    name: Build and inspect release candidate
    if: >-
      ${{ github.repository == 'yravelo/postgres-bulk' &&
          github.actor == 'yravelo' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Validate trusted dispatch and inputs
        shell: bash
        env:
          RELEASE_COMMIT: ${{ inputs.commit_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "${RELEASE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          expected_confirmation="candidate ${RELEASE_VERSION}"
          [[ "${CONFIRMATION}" == "${expected_confirmation}" ]]

      - name: Check out immutable candidate commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify candidate commit belongs to main
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${EXPECTED_COMMIT}" ]]
          git merge-base --is-ancestor "${EXPECTED_COMMIT}" origin/main
          [[ -z "$(git status --short)" ]]

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          overwrite-settings: false
          cache: maven
          cache-dependency-path: |
            code/postgres-bulk-parent/pom.xml
            code/postgres-bulk-parent/*/pom.xml
            examples/spring-boot-basic/pom.xml

      - name: Install release audit tools
        run: sudo apt-get update && sudo apt-get install --yes python3-yaml ripgrep

      - name: Revalidate workflow and secret security
        run: |
          ./scripts/check-workflow-security.py
          ./scripts/test-workflow-security.py
          ./scripts/check-secrets.sh history

      - name: Revalidate dependency vulnerabilities and update policy
        run: ./scripts/check-vulnerabilities.sh

      - name: Full normal build
        working-directory: code/postgres-bulk-parent
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Revalidate static-analysis reports
        run: ./scripts/check-static-analysis.py

      - name: Documentation and link gates
        run: ./scripts/check-documentation.sh

      - name: Local staging and isolated consumer
        run: ./scripts/release-dry-run.sh "${RELEASE_VERSION}"

      - name: Signature and release-inventory auditor regressions
        run: ./scripts/test-release-signatures.py

      - name: Revalidate canonical SBOM and production license evidence
        run: ./scripts/audit-production-licenses.sh "${RELEASE_VERSION}"

      - name: Public API baseline
        run: ./scripts/generate-public-api.sh --check

      - name: Reproducibility comparison
        run: ./scripts/compare-release-builds.sh "${RELEASE_VERSION}"

      - name: Diff and project-specific secret-pattern audit
        run: |
          git diff --check
          ! rg -n --hidden -g '!target/**' -g '!.git/**' \
            'BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY|centralPassword\s*=|token\s*[:=]\s*[A-Za-z0-9_-]{24,}' .

      - name: Upload inspected local candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: postgres-bulk-${{ inputs.version }}-release-candidate
          path: |
            target/release-staging
            target/release-audit
            target/reproducibility/*/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
