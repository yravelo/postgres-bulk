name: Compatibility

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: code/postgres-bulk-parent

jobs:
  multi-schema-composition:
    name: Multi-schema — JPA, JDBC and both starters / Java 17 / PostgreSQL 15.18
    if: >-
      github.event_name != 'pull_request' ||
      (github.actor == 'yravelo' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, postgres-bulk-ci]
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
          overwrite-settings: false
          settings-path: ${{ runner.temp }}
          cache: maven
          cache-dependency-path: code/postgres-bulk-parent/pom.xml
      - name: Verify multi-schema starter composition
        run: >-
          ./mvnw --batch-mode --no-transfer-progress clean verify
          -Dspotbugs.skip=true
          -pl postgres-bulk-spring-boot-starter,postgres-bulk-spring-boot-starter-data-jdbc
          -am
          -Dtest=PostgresBulkAutoConfigurationTest,PostgresBulkJdbcAutoConfigurationTest,BothStartersCoexistenceTest
          -Dit.test=PostgresBulkStarterIT,JdbcStarterSmokeIT
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dfailsafe.failIfNoSpecifiedTests=false

  java:
    name: Multi-schema — Java ${{ matrix.java }} / JDBC + JPA baseline stack
    if: >-
      github.event_name != 'pull_request' ||
      (github.actor == 'yravelo' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, postgres-bulk-ci]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          overwrite-settings: false
          settings-path: ${{ runner.temp }}
          cache: maven
          cache-dependency-path: code/postgres-bulk-parent/pom.xml
      - name: Verify on Java ${{ matrix.java }}
        run: ./mvnw --batch-mode --no-transfer-progress clean verify -Dspotbugs.skip=true

  boot-minimum:
    name: Multi-schema minimum — Java 17 / Boot + Data JDBC 3.5.0 / pgJDBC 42.7.13 / PostgreSQL 15.18
    if: >-
      github.event_name != 'pull_request' ||
      (github.actor == 'yravelo' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, postgres-bulk-ci]
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
          overwrite-settings: false
          settings-path: ${{ runner.temp }}
          cache: maven
          cache-dependency-path: code/postgres-bulk-parent/pom.xml
      - name: Audit managed stack
        run: >-
          ./mvnw --batch-mode --no-transfer-progress
          -Dspring-boot.version=3.5.0 -DskipTests
          -pl postgres-bulk-spring-boot-starter,postgres-bulk-spring-boot-starter-data-jdbc
          -am dependency:tree
          -Dincludes=org.springframework:spring-core,org.springframework:spring-jdbc,org.springframework.data:spring-data-jpa,org.springframework.data:spring-data-jdbc,org.springframework.data:spring-data-relational,org.hibernate.orm:hibernate-core,io.micrometer:micrometer-core,org.postgresql:postgresql
      - name: Verify Boot 3.5.0
        run: >-
          ./mvnw --batch-mode --no-transfer-progress clean verify
          -Dspotbugs.skip=true
          -Dspring-boot.version=3.5.0

  postgres:
    name: Multi-schema — PostgreSQL ${{ matrix.postgres }} / JDBC + JPA baseline stack
    if: >-
      github.event_name != 'pull_request' ||
      (github.actor == 'yravelo' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, postgres-bulk-ci]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        postgres: [16.14-alpine, 17.10-alpine]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
          overwrite-settings: false
          settings-path: ${{ runner.temp }}
          cache: maven
          cache-dependency-path: code/postgres-bulk-parent/pom.xml
      - name: Verify PostgreSQL ${{ matrix.postgres }}
        env:
          POSTGRES_VERSION: ${{ matrix.postgres }}
        run: >-
          ./mvnw --batch-mode --no-transfer-progress clean verify
          -Dspotbugs.skip=true
          -Dpostgres.version="${POSTGRES_VERSION}"

  newest:
    name: Multi-schema newest — Java 21 / Boot 3.5.16 / Data JDBC 3.5.13 / pgJDBC 42.7.13 / PostgreSQL 18.4
    if: >-
      github.event_name != 'pull_request' ||
      (github.actor == 'yravelo' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, postgres-bulk-ci]
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          overwrite-settings: false
          settings-path: ${{ runner.temp }}
          cache: maven
          cache-dependency-path: code/postgres-bulk-parent/pom.xml
      - name: Verify newest supported boundaries
        run: >-
          ./mvnw --batch-mode --no-transfer-progress clean verify
          -Dspotbugs.skip=true
          -Dhibernate.version=6.6.55.Final
          -Dpostgresql.version=42.7.13
          -Dpostgres.version=18.4-alpine
      - name: Audit JDBC starter dependency isolation
        run: >-
          ./mvnw --batch-mode --no-transfer-progress -DskipTests
          -Dpostgresql.version=42.7.13
          -pl postgres-bulk-spring-boot-starter-data-jdbc -am dependency:tree
          -Dincludes=org.springframework:spring-core,org.springframework:spring-jdbc,org.springframework.data:spring-data-jdbc,org.springframework.data:spring-data-relational,org.hibernate.orm:hibernate-core,org.springframework.data:spring-data-jpa,jakarta.persistence:jakarta.persistence-api,org.springframework.boot:spring-boot-starter-actuator,org.testcontainers:*,io.github.yravelo:postgres-bulk-benchmarks,org.postgresql:postgresql

  hibernate-adapter:
    name: Hibernate adapter ${{ matrix.hibernate }}
    if: >-
      github.event_name != 'pull_request' ||
      (github.actor == 'yravelo' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, postgres-bulk-ci]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        hibernate: [6.6.15.Final, 6.6.55.Final]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
          overwrite-settings: false
          settings-path: ${{ runner.temp }}
          cache: maven
          cache-dependency-path: code/postgres-bulk-parent/pom.xml
      - name: Verify Hibernate adapter
        env:
          HIBERNATE_VERSION: ${{ matrix.hibernate }}
        run: >-
          ./mvnw --batch-mode --no-transfer-progress clean verify
          -Dspotbugs.skip=true
          -pl postgres-bulk-hibernate -am
          -Dhibernate.version="${HIBERNATE_VERSION}"

  pgjdbc:
    name: pgJDBC ${{ matrix.pgjdbc }}
    if: >-
      github.event_name != 'pull_request' ||
      (github.actor == 'yravelo' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, postgres-bulk-ci]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pgjdbc: [42.7.5, 42.7.13]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
          overwrite-settings: false
          settings-path: ${{ runner.temp }}
          cache: maven
          cache-dependency-path: code/postgres-bulk-parent/pom.xml
      - name: Verify pgJDBC COPY adapter
        env:
          PGJDBC_VERSION: ${{ matrix.pgjdbc }}
        run: >-
          ./mvnw --batch-mode --no-transfer-progress clean verify
          -Dspotbugs.skip=true
          -pl postgres-bulk-pgjdbc -am
          -Dpostgresql.version="${PGJDBC_VERSION}"
