version: 2
updates:
  - package-ecosystem: maven
    directory: /code/postgres-bulk-parent
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    groups:
      test-infrastructure:
        patterns:
          - "org.junit:*"
          - "org.testcontainers:*"
        update-types:
          - minor
          - patch
      maven-build-tooling:
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.codehaus.mojo:*"
          - "com.diffplug.spotless:*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      - dependency-name: org.springframework.boot:spring-boot-dependencies
        update-types:
          - version-update:semver-minor

  - package-ecosystem: maven
    directory: /examples/spring-boot-basic
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Madrid
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: maven
    directory: /examples/spring-boot-data-jdbc
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Madrid
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: maven
    directory: /verification/spring-boot-jdbc-consumer
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/Madrid
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    groups:
      github-actions-maintenance:
        patterns:
          - "actions/*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: /examples/spring-boot-basic
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: Europe/Madrid
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: postgres
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: /examples/spring-boot-data-jdbc
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Europe/Madrid
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: postgres
        update-types:
          - version-update:semver-major
