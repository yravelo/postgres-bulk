services:
  postgres:
    image: postgres:15.18-alpine
    environment:
      POSTGRES_DB: postgres_bulk_example
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres_bulk_example"]
      interval: 2s
      timeout: 3s
      retries: 15
